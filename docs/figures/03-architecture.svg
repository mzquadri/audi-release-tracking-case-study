<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img"><defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7A6BA8"/><stop offset="52%" stop-color="#4C7CAE"/><stop offset="100%" stop-color="#4E9A92"/></linearGradient></defs><rect width="1100" height="440" fill="#F4F6FA"/><rect width="1100" height="4" fill="url(#r)"/><text x="40" y="52" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2430" text-anchor="start">Where it sits</text><text x="40" y="78" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6C7D" text-anchor="start">One workbook, two interfaces, and the release system beside them</text><rect x="40" y="112" width="420" height="290" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" opacity="1"/><text x="64" y="146" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1B2430" text-anchor="start">The workbook</text><rect x="64" y="170" width="372" height="58" rx="8" fill="#E9EDF3" stroke="#D8DEE8" stroke-width="1.5" opacity="1"/><rect x="64" y="170" width="4" height="58" rx="2" fill="#7A6BA8"/><text x="84" y="196" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="start">UserForms</text><text x="84" y="215" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6C7D" text-anchor="start">German and Chinese market</text><rect x="64" y="244" width="372" height="58" rx="8" fill="#E9EDF3" stroke="#D8DEE8" stroke-width="1.5" opacity="1"/><rect x="64" y="244" width="4" height="58" rx="2" fill="#7A6BA8"/><text x="84" y="270" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="start">VBA modules</text><text x="84" y="289" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6C7D" text-anchor="start">lookup, validation, write back</text><rect x="64" y="318" width="372" height="58" rx="8" fill="#E9EDF3" stroke="#D8DEE8" stroke-width="1.5" opacity="1"/><rect x="64" y="318" width="4" height="58" rx="2" fill="#7A6BA8"/><text x="84" y="344" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="start">data sheet</text><text x="84" y="363" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6C7D" text-anchor="start">about 600 rows, 130+ columns</text><rect x="640" y="112" width="420" height="290" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" opacity="1"/><text x="664" y="146" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#4E9A92" text-anchor="start">FREIPRO</text><text x="664" y="168" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6C7D" text-anchor="start">the release system every department already used</text><rect x="664" y="190" width="372" height="92" rx="8" fill="#E9EDF3" stroke="#D8DEE8" stroke-width="1.5" opacity="1"/><text x="688" y="224" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="start">the dashboard the buttons reach</text><text x="688" y="248" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6C7D" text-anchor="start">so the tool&#x27;s records stay in step with the company&#x27;s</text><rect x="664" y="300" width="372" height="76" rx="8" fill="#E9EDF3" stroke="#D8DEE8" stroke-width="1.5" opacity="1"/><text x="688" y="330" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="start">adopted beyond the first department</text><text x="688" y="353" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6C7D" text-anchor="start">built for one, later taken up by numerous others</text><line x1="466" y1="240" x2="627.0" y2="240.0" stroke="#4C7CAE" stroke-width="2.5" stroke-linecap="round"/><polygon points="634,240 627.0,244.2 627.0,235.8" fill="#4C7CAE"/><line x1="634" y1="282" x2="473.0" y2="282.0" stroke="#4C7CAE" stroke-width="2.5" stroke-linecap="round"/><polygon points="466,282 473.0,277.8 473.0,286.2" fill="#4C7CAE"/><text x="550" y="228" font-family="'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#5F6C7D" text-anchor="middle">link</text></svg>