<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img"><defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#A99CD6"/><stop offset="52%" stop-color="#87AEDA"/><stop offset="100%" stop-color="#82C0B8"/></linearGradient></defs><rect width="1100" height="420" fill="#0E131A"/><rect width="1100" height="4" fill="url(#r)"/><text x="40" y="52" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#DDE5EE" text-anchor="start">What the tool does when you click</text><text x="40" y="78" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8795A6" text-anchor="start">One pass, from the dropdown to the sheet and back</text><rect x="40" y="128" width="158" height="92" rx="10" fill="#161D27" stroke="#2A3340" stroke-width="1.5" opacity="1"/><rect x="40" y="128" width="158" height="4" rx="2" fill="#87AEDA"/><text x="119.0" y="170" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#DDE5EE" text-anchor="middle">UserForm</text><text x="119.0" y="192" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8795A6" text-anchor="middle">opens on the sheet</text><line x1="202" y1="174" x2="217.0" y2="174.0" stroke="#2A3340" stroke-width="2" stroke-linecap="round"/><polygon points="224,174 217.0,178.2 217.0,169.8" fill="#2A3340"/><rect x="228" y="128" width="158" height="92" rx="10" fill="#161D27" stroke="#2A3340" stroke-width="1.5" opacity="1"/><rect x="228" y="128" width="158" height="4" rx="2" fill="#87AEDA"/><text x="307.0" y="170" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#DDE5EE" text-anchor="middle">select</text><text x="307.0" y="192" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8795A6" text-anchor="middle">component from a list</text><line x1="390" y1="174" x2="405.0" y2="174.0" stroke="#2A3340" stroke-width="2" stroke-linecap="round"/><polygon points="412,174 405.0,178.2 405.0,169.8" fill="#2A3340"/><rect x="416" y="128" width="158" height="92" rx="10" fill="#161D27" stroke="#2A3340" stroke-width="1.5" opacity="1"/><rect x="416" y="128" width="158" height="4" rx="2" fill="#87AEDA"/><text x="495.0" y="170" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#DDE5EE" text-anchor="middle">look up</text><text x="495.0" y="192" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8795A6" text-anchor="middle">the row behind it</text><line x1="578" y1="174" x2="593.0" y2="174.0" stroke="#2A3340" stroke-width="2" stroke-linecap="round"/><polygon points="600,174 593.0,178.2 593.0,169.8" fill="#2A3340"/><rect x="604" y="128" width="158" height="92" rx="10" fill="#161D27" stroke="#2A3340" stroke-width="1.5" opacity="1"/><rect x="604" y="128" width="158" height="4" rx="2" fill="#87AEDA"/><text x="683.0" y="170" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#DDE5EE" text-anchor="middle">fill frames</text><text x="683.0" y="192" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8795A6" text-anchor="middle">grouped by subject</text><line x1="766" y1="174" x2="781.0" y2="174.0" stroke="#2A3340" stroke-width="2" stroke-linecap="round"/><polygon points="788,174 781.0,178.2 781.0,169.8" fill="#2A3340"/><rect x="792" y="128" width="158" height="92" rx="10" fill="#161D27" stroke="#2A3340" stroke-width="1.5" opacity="1"/><rect x="792" y="128" width="158" height="4" rx="2" fill="#82C0B8"/><text x="871.0" y="170" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#DDE5EE" text-anchor="middle">edit</text><text x="871.0" y="192" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8795A6" text-anchor="middle">create, update, delete</text><line x1="954" y1="174" x2="969.0" y2="174.0" stroke="#2A3340" stroke-width="2" stroke-linecap="round"/><polygon points="976,174 969.0,178.2 969.0,169.8" fill="#2A3340"/><rect x="980" y="128" width="158" height="92" rx="10" fill="#161D27" stroke="#2A3340" stroke-width="1.5" opacity="1"/><rect x="980" y="128" width="158" height="4" rx="2" fill="#82C0B8"/><text x="1059.0" y="170" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#DDE5EE" text-anchor="middle">write back</text><text x="1059.0" y="192" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8795A6" text-anchor="middle">to the same sheet</text><text x="40" y="268" font-family="'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#8795A6" text-anchor="start">milestones the form annotates</text><rect x="40" y="284" width="72" height="38" rx="8" fill="#1B2430" stroke="#2A3340" stroke-width="1.5" opacity="1"/><text x="76" y="309" font-family="'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#DDE5EE" text-anchor="middle">X</text><rect x="126" y="284" width="72" height="38" rx="8" fill="#1B2430" stroke="#2A3340" stroke-width="1.5" opacity="1"/><text x="162" y="309" font-family="'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#DDE5EE" text-anchor="middle">P</text><rect x="212" y="284" width="72" height="38" rx="8" fill="#1B2430" stroke="#2A3340" stroke-width="1.5" opacity="1"/><text x="248" y="309" font-family="'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#DDE5EE" text-anchor="middle">B</text><rect x="298" y="284" width="72" height="38" rx="8" fill=